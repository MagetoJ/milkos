# netlify.toml (place in the ROOT of the repo, next to package.json)
# Architecture: browser -> Netlify (Next.js) --/api/v1/* proxied--> Render (FastAPI) -> Supabase

[build]
  command = "pnpm build"
  # Do NOT set `publish`. The Next.js runtime below configures it automatically.

[build.environment]
  # Next.js 16 needs Node 20.9+; 22 is a safe LTS choice.
  NODE_VERSION = "22"
  # Where the FastAPI backend lives (also read by next.config.mjs at build time).
  BACKEND_INTERNAL_URL = "https://milkos.onrender.com"

# Official Netlify runtime for Next.js (routing, SSR, API routes, middleware, images).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy every API call to the Render backend. status = 200 makes it a transparent
# proxy (not a redirect), so the session cookie stays first-party and CORS is not needed.
# `force = true` makes this rule win even if a matching file/route exists.
[[redirects]]
  from = "/api/v1/*"
  to = "https://milkos.onrender.com/api/v1/:splat"
  status = 200
  force = true

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker must always be re-checked, never served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# NOTE: do NOT add the SPA rule "/* -> /index.html". It breaks Next.js routing.