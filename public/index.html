<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MilkFlow</title>
</head>
<body>
  <h1>MilkFlow</h1>
  <p id="status">Checking API...</p>

  <script>
    const API_URL = "https://milkos.onrender.com"; // your Render URL

    fetch(`${API_URL}/`)
      .then((r) => r.json())
      .then((d) => (document.getElementById("status").textContent = "API is up: " + JSON.stringify(d)))
      .catch(() => (document.getElementById("status").textContent = "API unreachable"));
  </script>
</body>
</html>
