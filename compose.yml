services:
  lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:17
    container_name: milkos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: milkos
      POSTGRES_USER: milkos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milkos_dev_password}
    volumes:
      - milkos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milkos -d milkos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://milkos:${POSTGRES_PASSWORD:-milkos_dev_password}@db:5432/milkos
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_URL: http://localhost:8000
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_SCALE_SIMULATOR: ${NEXT_PUBLIC_SCALE_SIMULATOR:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  milkos_postgres_data: