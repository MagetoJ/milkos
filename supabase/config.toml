# Supabase CLI config for local development (`supabase start`).
# Hosted projects: mirror these settings in the dashboard (Authentication → Sign In / Providers,
# URL Configuration, Emails, Multi-Factor) — the CLI does not push auth settings on deploy.
#
# Local services: API/Auth http://127.0.0.1:54321 · Postgres :54322 · Studio :54323 · Mailpit (emails) :54324
# Schema is owned by Prisma (apps/api/prisma/migrations), not by supabase/migrations.

project_id = "milkos"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirm your MaziwaCollect account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your MaziwaCollect sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to MaziwaCollect"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your MaziwaCollect password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
# Phone OTP is phase 2: enable with a Send SMS hook that calls Africa's Talking.
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
